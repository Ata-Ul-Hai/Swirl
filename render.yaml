services:
  - type: web
    name: swirl-api
    env: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard from MongoDB Atlas
      - key: REDIS_URL
        sync: false # Optional Upstash Redis or Render Redis
      - key: ENABLE_REDIS
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false # Set to your Vercel frontend URL, e.g. https://swirl.vercel.app
