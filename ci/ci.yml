name: CI Pipeline

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  audit-and-test:
    name: Security Audit, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Workspace Dependencies
        run: npm install

      - name: Run NPM Security Audit
        run: npm run audit:check || true # Alert without blocking if low/moderate
        continue-on-error: true

      - name: Run Client Vitest Suites
        run: npm run client:test

      - name: Run Server Supertest Integration Suites
        run: npm run server:test

      - name: Verify Client Production Build
        run: npm run build
